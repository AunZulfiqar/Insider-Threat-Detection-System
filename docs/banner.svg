<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal animation: starting the Insider Threat Detection System and a CRITICAL alert firing">
  <defs>
    <style>
      .win   { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .bar   { fill: #161b22; }
      .dot   { r: 6; }
      .title { fill: #8b949e; font: 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .code  { font: 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .prompt{ fill: #58a6ff; }
      .txt   { fill: #c9d1d9; }
      .ok    { fill: #3fb950; }
      .warn  { fill: #d29922; }
      .crit  { fill: #f85149; }
      .dim   { fill: #6e7681; }
      .cursor{ fill: #c9d1d9; }

      .line {
        opacity: 0;
        animation: reveal 9s infinite;
      }
      @keyframes reveal {
        0%   { opacity: 0; }
        2%   { opacity: 1; }
        92%  { opacity: 1; }
        97%  { opacity: 0; }
        100% { opacity: 0; }
      }
      .l1  { animation-delay: 0.0s; }
      .l2  { animation-delay: 0.5s; }
      .l3  { animation-delay: 1.0s; }
      .l4  { animation-delay: 1.5s; }
      .l5  { animation-delay: 2.0s; }
      .l6  { animation-delay: 2.7s; }
      .l7  { animation-delay: 3.2s; }
      .l8  { animation-delay: 3.7s; }
      .l9  { animation-delay: 4.4s; }
      .l10 { animation-delay: 4.9s; }

      .blink {
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="338" rx="10" class="win"/>
  <path d="M1 11 A10 10 0 0 1 11 1 H889 A10 10 0 0 1 899 11 V33 H1 Z" class="bar"/>
  <circle class="dot" cx="24" cy="17" fill="#ff5f56"/>
  <circle class="dot" cx="44" cy="17" fill="#ffbd2e"/>
  <circle class="dot" cx="64" cy="17" fill="#27c93f"/>
  <text x="450" y="21" text-anchor="middle" class="title">insider-threat-system — python run.py</text>

  <!-- terminal body -->
  <g class="code" transform="translate(24, 62)">
    <text class="line l1"><tspan class="prompt">$</tspan><tspan class="txt"> python run.py</tspan></text>

    <text y="26" class="line l2"><tspan class="dim"> * </tspan><tspan class="txt">Loading Isolation Forest model (27 features)...</tspan><tspan class="ok"> OK</tspan></text>
    <text y="52" class="line l3"><tspan class="dim"> * </tspan><tspan class="txt">Keyword detection: </tspan><tspan class="ok">ENABLED</tspan><tspan class="txt"> (42 patterns)</tspan></text>
    <text y="78" class="line l4"><tspan class="dim"> * </tspan><tspan class="txt">Running on </tspan><tspan class="ok">http://localhost:5000</tspan></text>

    <text y="112" class="line l5"><tspan class="txt">──────────────────────────────────────────────</tspan></text>

    <text y="140" class="line l6"><tspan class="crit">[CRITICAL]</tspan><tspan class="txt"> risk detected — user </tspan><tspan class="prompt">NGF0157</tspan></text>
    <text y="166" class="line l7"><tspan class="txt">  → confidential data sent to external recipient, after-hours</tspan></text>
    <text y="192" class="line l8"><tspan class="txt">  → detection: </tspan><tspan class="warn">keyword + ml + contextual</tspan><tspan class="txt">   risk_score: </tspan><tspan class="crit">1.000</tspan></text>

    <text y="226" class="line l9"><tspan class="dim"> * </tspan><tspan class="txt">Alert </tspan><tspan class="ok">34783e5b6ac9b272</tspan><tspan class="txt"> created — analyst notified</tspan></text>

    <g class="line l10">
      <text y="254"><tspan class="prompt">$</tspan><tspan class="txt"> </tspan><tspan class="blink cursor">▊</tspan></text>
    </g>
  </g>
</svg>
